<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phaser Ragdoll</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-height: 100vh;
      max-height: 100vh;
      background: #1a1a1a;
      overflow: hidden;
    }
    #game-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }
    #panel-area {
      display: none; /* SandboxScene: 30vh + controls-panel; GameScene: 10vh + game-presets-panel */
      flex-shrink: 0;
      background: #1a1a1a;
      border-top: 1px solid #333;
      overflow: hidden;
    }
    #game-presets-panel {
      display: none;
      width: 100%;
      height: 100%;
      max-height: 12vh;
      flex: 1;
      flex-direction: row;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      gap: 0;
      background: #2d2d2d;
      padding: 10px 16px;
    }
    #game-presets-panel .preset-cell {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }
    #game-presets-panel .preset-cell label {
      font: 14px/1.3 sans-serif;
      color: #e0e0e0;
      margin-right: 10px;
      flex-shrink: 0;
    }
    #game-presets-panel select {
      padding: 8px 12px;
      font-size: 14px;
      background: #3a3a3a;
      color: #eee;
      border: 1px solid #555;
      border-radius: 6px;
      min-width: 160px;
      max-width: 220px;
    }
    #controls-panel {
      display: none;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      background: #2d2d2d;
      padding: 8px;
      flex-wrap: wrap;
      gap: 12px;
      align-content: flex-start;
      align-items: flex-start;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px 10px;
      background: #3a3a3a;
      border-radius: 6px;
      min-width: 140px;
    }
    .control-group label {
      font: 11px/1.2 sans-serif;
      color: #ccc;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .control-row input[type="range"] {
      flex: 1;
      min-width: 60px;
    }
    .control-row span {
      font: 11px monospace;
      color: #aaa;
      min-width: 36px;
    }
    .control-desc {
      font: 9px/1.2 sans-serif;
      color: #888;
      max-width: 160px;
      margin-top: 2px;
    }
    #controls-panel button {
      padding: 6px 12px;
      font-size: 12px;
      background: #4a7ab8;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #controls-panel button:hover {
      background: #5a8ac8;
    }
    #controls-panel select {
      padding: 4px 8px;
      font-size: 12px;
      background: #3a3a3a;
      color: #eee;
      border: 1px solid #555;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="panel-area">
    <div id="game-presets-panel"></div>
    <div id="controls-panel"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
